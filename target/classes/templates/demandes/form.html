                        </a>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/paiements}">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/districts}">

                    <li class="nav-item">

                </ul>

            <!-- Main Content -->
            <div class="col-md-10 main-content">

    <div class="page-header mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="mb-1">
                    <i class="fas fa-file-alt me-2"></i>
                    <span th:text="${demande.id == null} ? 'Nouvelle Demande' : 'Modifier Demande'">Demande</span>
                </h2>
            </div>
            <a th:href="@{/demandes}" class="btn btn-light">
                <i class="fas fa-arrow-left me-2"></i>Retour
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-edit me-2"></i>Informations de la Demande
        </div>
        <div class="card-body">
            <form th:action="@{/demandes}" th:object="${demande}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="client" class="form-label">
                            <i class="fas fa-user me-2 text-primary"></i>Client <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="client" th:field="*{client}" required>
                            <option value="">-- Sélectionnez un client --</option>
                            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom}">Client</option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="dateDemande" class="form-label">
                            <i class="fas fa-calendar me-2 text-primary"></i>Date de Demande
                        </label>
                        <input type="datetime-local" class="form-control" id="dateDemande" th:field="*{dateDemande}">
                    </div>
                </div>
                
                <hr class="my-4">
                <h5 class="mb-3"><i class="fas fa-map-marker-alt me-2"></i>Localisation</h5>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="region" class="form-label">
                            <i class="fas fa-globe-africa me-2 text-primary"></i>Région <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="region" th:field="*{region}" required>
                            <option value="">-- Sélectionnez une région --</option>
                            <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.nom}">Région</option>
                        </select>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label for="district" class="form-label">
                            <i class="fas fa-map me-2 text-primary"></i>District <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="district" th:field="*{district}" required>
                            <option value="">-- Sélectionnez un district --</option>
                            <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.nom}">District</option>
                        </select>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label for="commune" class="form-label">
                            <i class="fas fa-landmark me-2 text-primary"></i>Commune <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="commune" th:field="*{commune}" required>
                            <option value="">-- Sélectionnez une commune --</option>
                            <option th:each="c : ${communes}" th:value="${c.id}" th:text="${c.nom}">Commune</option>
                        </select>
                    </div>
                </div>
                
                <hr class="my-4">
                
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/demandes}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-2"></i>Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>
